    /* Loading screen */
    body {

      min-height: 100vh;

      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    
    /* iOS Standalone Mode Optimizations */
    @supports (-webkit-touch-callout: none) {
      body {
        height: -webkit-fill-available;
      }
    }
    
    .loading-container {
      text-align: center;
      color: white;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 18px;

  <div class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-text">Chargement de Garibobo Agenda...</div>
  </div>
  
  <script>
    // PWA Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('PWA install prompt available');
    });
    
    // iOS Standalone Detection
    if (window.navigator.standalone === true) {
      console.log('Running as iOS PWA');
    }
    
    // Prevent zoom on double tap for iOS
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
    
    // Service Worker sera enregistré automatiquement par flutter.js
    window.addEventListener('load', function() {
      if ('serviceWorker' in navigator) {
        console.log('Service Worker sera géré par Flutter');
      }
    });
  </script>
  
  <script src="pwa-install.js"></script>
  <script src="flutter_bootstrap.js" async></script>
